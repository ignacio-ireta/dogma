# Reuse the repository's locked tools; installation is an explicit developer action.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format check
        entry: uv run --frozen ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: privacy
        name: privacy audit
        entry: uv run --frozen python scripts/audit_privacy.py --staged
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
      - id: commit-files
        name: whitespace and large files
        entry: uv run --frozen python scripts/check_commit_files.py
        language: system
        types: [file]
        require_serial: true
      - id: web-lint
        name: web lint
        entry: pnpm --dir web lint
        language: system
        files: ^web/
        pass_filenames: false
        require_serial: true
