uncovered:
- clause: Raises `ValueError` for an invalid dtype, `ndim == 0`, an empty array, a nonfinite value, an
    invalid axis, or an underflowing scale. `absmax_dequantize(q, scale, axis=None)`
  reason: cap of eight wrong solutions per problem
- clause: '`q`: `numpy.int8` array. Any other dtype raises `ValueError`.'
  reason: cap of eight wrong solutions per problem
- clause: '`scale`: float64 array, finite and strictly positive. Its shape must match `axis` exactly (`()`
    for `None`, `(q.shape[axis],)` otherwise). A mismatch raises `ValueError`.'
  reason: cap of eight wrong solutions per problem
- clause: Returns `q * scale` as a float64 array, with the per-channel scale broadcast along `axis`. Shape
    equals `q.shape`.
  reason: cap of eight wrong solutions per problem
