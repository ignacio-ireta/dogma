  origin: freedom
  freedom: NaN keeps the sign bit of x, the Contract does not say what sign a NaN has
reject:
- file: reject_infinity_sign_dropped.py
  mistake: negative infinity returned as positive infinity
  clause: 'Returns: `float`. - NaN returns NaN. `+inf` and `-inf` return themselves. - A zero or a value
    that rounds to zero keeps the sign of `x`, so `-0.0` stays `-0.0`. - Overflow: if the rounded magnitude
    would be larger than the largest finite value of the format, the result is the infinity with the sign
    of `x`. This includes values at or above the midpoint between the largest finite value and the next
    power of two.'
  killed_by: test_nan_and_infinities_pass_through_and_zero_keeps_its_sign
  visible: hidden
