- file: reject_accepts_gamma_above_one.py
  mistake: accepts a gamma above one, so the rate can grow at each drop
  clause: '`gamma`: `float`, finite, `0 < gamma <= 1`. The multiplicative factor at each drop.'
  killed_by: test_invalid_arguments_raise_value_error
  visible: hidden
