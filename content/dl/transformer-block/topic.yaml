id: dl/transformer-block
title: "Transformer block"
tier: A
requires: ['dl/dense-layer-forward-pass', 'cml/softmax', 'dl/layer-normalization', 'dl/residual-connections', 'dl/causal-masking', 'dl/multi-head-attention', 'dl/position-wise-feed-forward-block']
