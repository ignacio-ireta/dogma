id: dl/a-complete-training-loop/p01-fit-with-seeded-batches
version: 4                      # bump when tests, tolerances or the contract change
title: Seeded training loop with best-checkpoint restore
language: python                # python | sql
runtime: py-torch               # py-stdlib | py-numpy | py-data | sql-duckdb | py-torch
entry: fit                      # the function or class name the learner implements
difficulty: medium
minutes: 30
core: true                      # p01 is the core problem: exactly one per topic
# atol and rtol 1e-9 are the float64 bar. The reference and the learner run the same operations in the
# same order, so their losses agree to roundoff. Plain SGD and torch.optim.SGD differ only in rounding.
tolerance: {atol: 1.0e-9, rtol: 1.0e-9}
banned_imports: [torch.utils.data.DataLoader, torch.utils.data.RandomSampler, torch.utils.data.BatchSampler]
timeout_s: 30
status: reviewed