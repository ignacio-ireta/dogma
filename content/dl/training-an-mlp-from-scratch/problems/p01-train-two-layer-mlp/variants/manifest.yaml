  clause: Compute `H=tanh(X@W1+b1)`, `prediction=H@W2+b2`, and `loss=mean((prediction-y)**2)/2`. Compute
    all four gradients from the same pre-update checkpoint, then subtract `lr*gradient` from each parameter.
  killed_by: test_one_step_all_parameter_gradients_finite_difference
  visible: hidden
- file: reject_losses_drop_last.py
