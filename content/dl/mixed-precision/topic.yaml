id: dl/mixed-precision
title: "Mixed precision"
tier: A
requires: [dl/one-training-step, inf/floating-point-formats]
aliases: [autocast, loss scaling, GradScaler, fp16, bf16, master weights, dynamic loss scale]
objectives:
