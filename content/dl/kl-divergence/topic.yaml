id: dl/kl-divergence
title: "KL divergence"
tier: A
requires: ['cml/entropy-and-mutual-information', 'cml/cross-entropy', 'cml/softmax']
aliases: ['relative entropy', 'information divergence', 'forward KL', 'reverse KL', 'KL from logits']
objectives:
