problem_version: 3
accept:
- file: accept_blind.py
  origin: blind
- file: accept_reverse_sum_order.py
  origin: freedom
  freedom: sum the class terms in reverse order, only the last digits differ
reject:
- file: reject_int_inputs_rejected.py
  mistake: integer inputs rejected, only float accepted
  clause: '`p_logits`, `q_logits`: array-likes of shape `(n, k)` with `n >= 1` and `k >= 1`, the same
    shape. Entries are real numbers. An entry may be `-inf`, which means that class has probability zero.
    Booleans, complex numbers and objects are invalid. `NaN` and `+inf` are invalid.'
  killed_by: test_integer_logits_are_accepted_and_match_float_logits
  visible: hidden
- file: reject_any_finite_whole_matrix.py
  mistake: row all -inf accepted when the whole matrix has one finite entry
  clause: Every row of each input must contain at least one finite entry, so that the distribution is
    defined.
  killed_by: test_one_row_without_finite_logits_raises_even_when_other_rows_are_valid
  visible: hidden
- file: reject_reverse_direction.py
  mistake: arguments swapped so the reverse KL is computed
  clause: 'Returns: float64 array of shape `(n,)`. Element `i` is $$\mathrm{KL}(P_i\|Q_i)=\sum_{j} p_{ij}\,(\log
    p_{ij}-\log q_{ij}).$$'
  killed_by: test_half_half_against_one_quarter_three_quarters
  visible: public
- file: reject_no_max_shift.py
  mistake: row maximum not subtracted before exp, overflow for large logits
  clause: 'Returns: float64 array of shape `(n,)`. Element `i` is $$\mathrm{KL}(P_i\|Q_i)=\sum_{j} p_{ij}\,(\log
    p_{ij}-\log q_{ij}).$$'
  killed_by: test_large_logits_do_not_overflow
  visible: hidden
- file: reject_nan_check_drops_posinf.py
  mistake: plus inf logits accepted, the +inf check is dropped
  clause: 'Raises `ValueError` when: an input is not 2-D, is empty, or has a dtype that is not real numeric;
    the shapes differ; an input contains `NaN` or `+inf`; or a row of either input has no finite entry.'
  killed_by: test_invalid_inputs_raise_value_error
  visible: hidden
- file: reject_mutates_row_zero.py
  mistake: first row of a float64 input shifted in place
  clause: Must not mutate its inputs.
  killed_by: test_inputs_are_not_mutated
  visible: hidden
uncovered:
- clause: 'Conventions: a class with $p_{ij}=0$ contributes $0$, even when $q_{ij}=0$ (that is $0\log
    0=0$). A class with $p_{ij}>0$ and $q_{ij}=0$ makes that row''s KL `+inf`. The output can therefore
    contain `inf`. It is never `-inf` and never `nan`.'
  reason: wrong solution survives, see notes
sweeps:
- reject
