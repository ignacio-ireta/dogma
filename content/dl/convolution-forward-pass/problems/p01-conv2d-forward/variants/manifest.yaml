reject:
- file: reject_weight_dtype_cast_silently.py
  mistake: casts a wider weight to x dtype instead of raising
  clause: '`weight`: tensor of shape `(C_out, C_in, kH, kW)` with `C_out, kH, kW >= 1`. Its dtype is `x`''s
    dtype. Its second axis must equal `C_in`.'
  killed_by: test_weight_wider_than_x_raises_value_error
  visible: hidden
- file: reject_single_example_batch_rejected.py
  mistake: rejects a batch of one example
  clause: '`x`: floating-point tensor of shape `(N, C_in, H, W)`, every axis at least 1. `N` is the batch.'
  killed_by: test_ones_kernel_sums_each_two_by_two_window
  visible: public
- file: reject_bias_dtype_unchecked.py
  mistake: bias dtype is never checked
  clause: '`bias`: `None`, or a tensor of shape `(C_out,)` with `x`''s dtype. `None` means no bias.'
  killed_by: test_invalid_inputs_raise_value_error
  visible: hidden
- file: reject_bool_stride_accepted.py
  mistake: booleans accepted as stride and padding
  clause: '`stride`: integer `s >= 1`, the same on both spatial axes. Booleans are invalid.'
  killed_by: test_invalid_inputs_raise_value_error
  visible: hidden
- file: reject_padding_only_bottom_right.py
  mistake: pads only the bottom and right
  clause: '`padding`: integer `p >= 0`, the same on both sides of both spatial axes. Booleans are invalid.'
  killed_by: test_padding_gives_the_expected_output_size_and_values
  visible: public
- file: reject_output_size_plus_one_before_floor.py
  mistake: output height counts one extra kernel row before the floor
  clause: 'Output size: $H_{\text{out}}=\left\lfloor\frac{H+2p-k_H}{s}\right\rfloor+1$, and the same formula
    for $W_{\text{out}}$ with $k_W$. The floor rounds down.'
  killed_by: test_ones_kernel_sums_each_two_by_two_window
  visible: public
- file: reject_output_float64_always.py
  mistake: output is always float64
  clause: 'Returns: tensor of shape `(N, C_out, H_out, W_out)` with `x`''s dtype.'
  killed_by: test_float32_inputs_return_float32_close_to_the_reference
  visible: hidden
- file: reject_kernel_exactly_fitting_rejected.py
  mistake: kernel exactly fitting the padded input is rejected
  clause: 'Raises `ValueError` when: `x` is not a floating 4-D tensor, or has a zero-size axis; `weight`
    is not a 4-D tensor of `x`''s dtype, or its second axis is not `C_in`; `bias` has the wrong shape
    or dtype; `stride` is not an integer `>= 1`; `padding` is not an integer `>= 0`; or the kernel does
    not fit in the padded input, so that $H_{\text{out}}$ or $W_{\text{out}}$ would be below 1.'
  killed_by: test_kernel_is_not_flipped
  visible: public
- file: reject_takes_abs_of_bias_in_place.py
  mistake: returns the right result and replaces the caller's bias by its absolute values in place
  clause: Must not mutate `x`, `weight` or `bias`.
  killed_by: test_a_bias_with_negative_entries_is_not_modified
  visible: hidden
- file: reject_result_detached_from_the_graph.py
  mistake: returns the right values cut off from the autograd graph, so no gradient reaches the inputs
  clause: 'Differentiable: the result stays on the autograd graph. When an input has `requires_grad=True`,
    backpropagating through the result gives the gradient of the formula above. Do not detach, and do
    not leave PyTorch (`.item()`, `.numpy()`, `torch.no_grad()`) on the way.'
  killed_by: test_gradients_flow_back_through_the_result
  visible: hidden
uncovered: []
