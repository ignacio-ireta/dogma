- clause: '`k`: floating-point tensor of shape `(*batch, S, d_k)`.'
  reason: cap of eight wrong solutions per problem
- clause: '`v`: floating-point tensor of shape `(*batch, S, d_v)`.'
  reason: cap of eight wrong solutions per problem
- clause: '`q`, `k` and `v` have the same dtype and identical `batch` shapes. All of `L`, `S`, `d_k`,
    `d_v` and every batch axis are at least 1. Each tensor has rank at least 2.'
  reason: cap of eight wrong solutions per problem
- clause: 'Returns: a tuple `(output, weights)`.'
  reason: cap of eight wrong solutions per problem
