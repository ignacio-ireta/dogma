  killed_by: test_non_finite_logits_raise_value_error
  visible: hidden
- file: reject_no_renorm_after_top_k.py
  mistake: top-k survivors not renormalised before top-p
  clause: 'Steps: 1. `z = logits / temperature`, then `p = softmax(z)`. Use a stable softmax. 2. Top-k.
    Sort the tokens by `p`, descending. Ties go to the lower token index. Keep the first `top_k` tokens
    and set the rest to probability `0`. Renormalise the kept tokens to sum to `1`. 3. Top-p. Use the
    probabilities **after step 2''s renormalisation**, so the survivors of top-k sum to `1`. Sort the
    kept tokens by those probabilities, descending, with ties again going to the lower index. Let `c_j`
    be the cumulative sum of the sorted probabilities, in float64, and compare it to `top_p` directly,
    with no tolerance. Keep the smallest prefix whose cumulative sum satisfies `c_j >= top_p`, including
    the token that reaches it. The prefix always holds at least one token. Set the rest to `0` and renormalise.
    With `top_k` absent, step 3 runs on the full softmax.'
  killed_by: test_top_k_tie_at_the_boundary_keeps_the_lower_index
  visible: public
