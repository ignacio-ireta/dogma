uncovered:
- clause: 'Method: draw one uniform value `u` in `[0, 1)` from `generator`. Let `cdf = cumsum(probs)`.
    Return the first index `i` with `cdf[i] > u`, with the **strict** inequality. In PyTorch that is `torch.searchsorted(cdf,
    u, right=True)`. Do not use `right=False` (`cdf[i] >= u`): when `u` is exactly `0` and `probs[0] =
    0`, it returns index `0`, which has probability `0`. Rounding can leave `cdf[-1]` a hair below `u`,
    and the search then returns `V`. In that case return the last index with `probs > 0`, never an index
    whose probability is `0`. The sum check allows a deficit of up to `1e-9`, so this case has probability
    at most about `1e-9` per draw. A seeded test cannot hit it reliably, so the rule is pinned here rather
    than tested by draws.'
  reason: wrong solution survives, see notes
- clause: 'Consequence: a token with probability `0` is never returned. Each call uses exactly one draw
    from the generator, so a generator seeded the same way gives the same sequence of tokens.'
  reason: wrong solution survives, see notes
