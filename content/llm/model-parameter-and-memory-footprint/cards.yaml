cards:
  - id: llm/model-parameter-and-memory-footprint#1
    type: qa
    front: What is the parameter count of one gelu transformer block with biases and layernorm?
    back: "4D^2 + 2DF + 9D + F, where F is the MLP width."
  - id: llm/model-parameter-and-memory-footprint#2
    type: qa
    front: Which component does a tied LM head add to the count?
    back: Zero. It reuses the V times D token table.
  - id: llm/model-parameter-and-memory-footprint#3
    type: qa
    front: How many bytes per parameter does mixed-precision Adam need in training?
    back: "16: 2 for bf16 weights, 2 for gradients, 4 for the fp32 master copy and 8 for two fp32 Adam states."
  - id: llm/model-parameter-and-memory-footprint#4
    type: qa
    front: How many bytes per parameter does fp32 Adam need, without a master copy?
    back: 16, as 4 for weights, 4 for gradients and 8 for two fp32 states.
  - id: llm/model-parameter-and-memory-footprint#5
    type: qa
    front: What does the training rule of thumb leave out?
    back: Activations, buffers, fragmentation and any sharding of the optimizer state.
  - id: llm/model-parameter-and-memory-footprint#6
    type: cloze
    text: "A gated swiglu MLP has {{c1::three}} weight matrices per block."
