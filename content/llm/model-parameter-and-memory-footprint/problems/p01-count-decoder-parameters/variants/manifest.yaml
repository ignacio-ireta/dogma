reject:
- file: reject_attention_single_block.py
  mistake: attention counted for one block only, not times the number of layers
  clause: 'Returns: a `dict[str, int]` with these keys, in this order: `"token_embedding"`, `"position_embedding"`,
    `"attention"`, `"mlp"`, `"norms"`, `"final_norm"`, `"lm_head"`, `"total"`. Each component counts **all**
    layers, so `attention` is `N` times one block''s attention. `total` is the exact sum of the other
    seven entries.'
  killed_by: test_gpt2_small_total_matches_the_published_configuration
  visible: public
- file: reject_bool_accepted_as_int.py
  mistake: bool accepted where an int is required
  clause: Integers must be real `int` values, not `bool`, not floats, and not NumPy scalars.
  killed_by: test_invalid_configs_raise_value_error
  visible: hidden
- file: reject_config_mutated.py
  mistake: writes into the caller config dict
  clause: Must not mutate `config`. Python integers are unbounded, so large configs must give exact results.
  killed_by: test_component_counts_match_the_shape_enumeration
  visible: hidden
- file: reject_divisibility_unchecked.py
  mistake: does not check that n_heads divides d_model
  clause: 'Raises `ValueError` when: `config` is not a `dict`; a key is missing or unexpected; a value
    has the wrong type or range; `n_heads` does not divide `d_model`; `mlp` or `norm` is not one of the
    allowed strings.'
  killed_by: test_invalid_configs_raise_value_error
  visible: hidden
- file: reject_n_layers_minimum_one.py
  mistake: n_layers of zero rejected although the range allows it
  clause: '`config`: a `dict` with exactly these keys and no others: | key | type | meaning | |---|---|---|
    | `vocab_size` | `int` | `V`, at least 1 | | `d_model` | `int` | `D`, at least 1 | | `n_layers` |
    `int` | `N`, at least 0 | | `n_heads` | `int` | `H`, at least 1, and must divide `D` | | `d_ff` |
    `int` | `F`, the MLP expansion width, at least 1 | | `context_length` | `int` | `C`, at least 1, the
    length of the position table | | `learned_positions` | `bool` | whether the position table exists
    | | `bias` | `bool` | whether linear layers carry bias vectors | | `mlp` | `str` | `"gelu"` or `"swiglu"`
    | | `norm` | `str` | `"layernorm"` or `"rmsnorm"` | | `tie_embeddings` | `bool` | whether the LM head
    reuses the token embedding |'
  killed_by: test_zero_layers_have_no_per_block_parameters
  visible: public
