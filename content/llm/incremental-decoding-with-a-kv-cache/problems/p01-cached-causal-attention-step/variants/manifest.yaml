  origin: blind
- file: accept_reciprocal_scale.py
  origin: freedom
  freedom: scales the scores by multiplying with the reciprocal of sqrt d_k instead of dividing
reject:
- file: reject_single_token_squeezes_output.py
  mistake: single new token output is squeezed to two dimensions
  clause: '`x_new`: `torch.float64` tensor of shape `(B, T, d)`, with `B >= 1` and `T >= 1`.'
  killed_by: test_first_token_attends_only_to_itself
  visible: public
- file: reject_query_without_weight_transpose.py
  mistake: query projection skips the transpose of the weight
  clause: '`W_q`, `W_k`, `W_v`, `W_o`: `torch.float64` tensors of shape `(d, d)` in `nn.Linear` layout,
    so a projection is `y = x @ W.T`. There are no biases.'
  killed_by: test_decode_steps_match_full_recomputation_single_head
  visible: hidden
- file: reject_bool_accepted_as_head_count.py
  mistake: bool accepted as head count
  clause: '`num_heads`: `int`, `>= 1`. It must divide `d`. A `bool` is rejected.'
  killed_by: test_bool_num_heads_raises_value_error
  visible: hidden
- file: reject_scale_by_model_width.py
  mistake: score scaled by model width instead of head width
  clause: 'Steps: 1. Project only the new tokens: `Q`, `K_new` and `V_new`, each `(B, T, d)`, then split
    them into heads of shape `(B, h, T, d_k)`. 2. Append `K_new` and `V_new` after the cache along the
    key axis, so `K` and `V` have shape `(B, h, S + T, d_k)`. 3. Score every new query against every key
    with `Q K^T / sqrt(d_k)`. The new query at row `i` (`0 <= i < T`) sits at absolute position `S + i`.
    It may attend key `j` exactly when `j <= S + i`. Masked scores get zero weight. 4. Softmax over the
    key axis, take the weighted sum of `V`, merge the heads back to `(B, T, d)`, and apply `W_o`.'
  killed_by: test_decode_steps_match_full_recomputation_multi_head
  visible: hidden
- file: reject_mask_offset_by_one.py
  mistake: causal mask ignores the cache offset
  clause: 'Steps: 1. Project only the new tokens: `Q`, `K_new` and `V_new`, each `(B, T, d)`, then split
    them into heads of shape `(B, h, T, d_k)`. 2. Append `K_new` and `V_new` after the cache along the
    key axis, so `K` and `V` have shape `(B, h, S + T, d_k)`. 3. Score every new query against every key
    with `Q K^T / sqrt(d_k)`. The new query at row `i` (`0 <= i < T`) sits at absolute position `S + i`.
    It may attend key `j` exactly when `j <= S + i`. Masked scores get zero weight. 4. Softmax over the
    key axis, take the weighted sum of `V`, merge the heads back to `(B, T, d)`, and apply `W_o`.'
  killed_by: test_second_step_reads_the_cached_key_and_value
  visible: public
- file: reject_cache_keeps_only_new_tokens.py
  mistake: returned cache holds only the new tokens
  clause: 'Returns: a tuple `(output, new_cache)`. `output` is `torch.float64` of shape `(B, T, d)`. `new_cache`
    is a tuple `(K, V)` of `torch.float64` tensors, each `(B, h, S + T, d_k)`, whose first `S` positions
    equal the input cache exactly.'
  killed_by: test_decode_steps_match_full_recomputation_single_head
  visible: hidden
- file: reject_missing_kv_shape_check.py
  mistake: no check that cache keys and values have the same length
  clause: 'Raises `ValueError` when: `x_new` is not a 3-D `float64` tensor; `B = 0` or `T = 0`; `d` is
    not divisible by `num_heads`; `num_heads` is not a positive `int`; a weight is not `(d, d)` float64;
    `cache` is neither `None` nor a 2-element tuple or list; a cache tensor is not a 4-D `float64` tensor
    of shape `(B, h, S, d_k)` with `K` and `V` the same shape.'
  killed_by: test_cache_keys_and_values_of_different_lengths_raise_value_error
  visible: hidden
- file: reject_empty_batch_accepted.py
  mistake: zero batch accepted instead of raising
  clause: 'Raises `ValueError` when: `x_new` is not a 3-D `float64` tensor; `B = 0` or `T = 0`; `d` is
    not divisible by `num_heads`; `num_heads` is not a positive `int`; a weight is not `(d, d)` float64;
    `cache` is neither `None` nor a 2-element tuple or list; a cache tensor is not a 4-D `float64` tensor
    of shape `(B, h, S, d_k)` with `K` and `V` the same shape.'
  killed_by: test_zero_batch_raises_value_error
  visible: hidden
- file: reject_input_scaled_in_place.py
  mistake: input divided in place when its largest entry exceeds one
  clause: Must not mutate `x_new`, the weights, or the input cache tensors.
  killed_by: test_input_and_weights_are_not_mutated
  visible: hidden
uncovered:
- clause: '`cache`: either `None` (an empty cache), or a tuple `(K_c, V_c)` of two `torch.float64` tensors,
    each of shape `(B, h, S, d_k)`, with `S >= 0`. `K_c` and `V_c` hold the keys and values of the `S`
    earlier tokens, already split into heads, with `d_k = d // h`.'
  reason: a wrong cache layout breaks the append (C5) or the shape check (C7), so no separate mistake
    for C2 alone
