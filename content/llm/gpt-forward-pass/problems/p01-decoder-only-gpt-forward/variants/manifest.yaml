  killed_by: test_matches_gpt_reference_on_seeded_batches
  visible: hidden
- file: reject_always_tied_head.py
  mistake: head is always tied even when lm_head is given
  clause: '`params`: a mapping with these keys. `V`, `D`, `C` and the block feed-forward width `F` are
    read from the shapes given here. | key | shape | role | |---|---|---| | `tok_emb` | `(V, D)` | token
    embedding table | | `pos_emb` | `(C, D)` | position embedding table; row `t` is position `t` | | `blocks`
    | list of `N` mappings, `N >= 0` | one block per entry, each with the 16 keys below | | `ln_f_gamma`,
    `ln_f_beta` | `(D,)` | final LayerNorm scale and shift | | `lm_head` | `(D, V)` | **optional.** Present
    means untied. Absent means tied | Each block mapping has exactly these 16 keys, with the shapes of
    `dl/transformer-block`: `ln1_gamma`, `ln1_beta` `(D,)`; `W_q`, `W_k`, `W_v`, `W_o` `(D, D)`; `b_q`,
    `b_k`, `b_v`, `b_o` `(D,)`; `ln2_gamma`, `ln2_beta` `(D,)`; `W_1` `(D, F)`; `b_1` `(F,)`; `W_2` `(F,
    D)`; `b_2` `(D,)`. Each block''s feed-forward width `F >= 1` is read from its own `W_1`. Every tensor
    in `params` has the dtype of `tok_emb`, which is a floating-point dtype.'
  killed_by: test_matches_gpt_reference_on_seeded_batches
  visible: hidden
- file: reject_epsilon_outside_root.py
  mistake: LayerNorm epsilon added after the square root
  clause: 'Definitions, with $\varepsilon = 10^{-5}$: - Embedding: $x_{b,t} = \mathrm{tok\_emb}[idx_{b,t}]
    + \mathrm{pos\_emb}[t]$. Shape $(B, T, D)$. - LayerNorm over the last axis with **biased** variance,
    $\mathrm{LN}(u)=\gamma\odot(u-\mu)/\sqrt{\sigma^2+\varepsilon}+\beta$. - Exact GELU: $\mathrm{gelu}(z)=\tfrac12
    z\,(1+\operatorname{erf}(z/\sqrt2))$. - Causal attention: query $i$ may not attend to any key $j>i$.
    Scores are scaled by $1/\sqrt{d_\text{head}}$. - Tied head: logits $=h\,\mathrm{tok\_emb}^\top$, with
    $h$ the final LayerNorm output. - Untied head: logits $=h\,\mathrm{lm\_head}$.'
  killed_by: test_matches_gpt_reference_on_seeded_batches
  visible: hidden
