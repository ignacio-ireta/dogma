  mistake: tuple input loses its first pair
  clause: '`judgments`: a non-empty list or tuple. Each element is a pair `(forward, reverse)`, one entry
    per comparison item. - `forward` is the verdict when `X` is in position A and `Y` is in position B.
    - `reverse` is the verdict when `Y` is in position A and `X` is in position B. - A verdict is `"A"`
    (the answer in position A is better), `"B"` (position B is better) or `"tie"`.'
  killed_by: test_tuple_of_judgments_is_read_in_full
  visible: hidden
- file: reject_reverse_order_not_swapped.py
  mistake: reads the reverse order without the position swap
  clause: '**Per-order reading for `X`.** In `forward`, `"A"` means `X` wins, `"B"` means `Y` wins. In
    `reverse`, `"B"` means `X` wins, `"A"` means `Y` wins. `"tie"` is a tie in either order.'
  killed_by: test_mixed_consistent_inconsistent_and_tie_items
  visible: public
- file: reject_single_win_counts_as_full.py
  mistake: one decisive win for X counts as a full point
  clause: '**Item score for `X`.** Score `1.0` when `X` wins in both orders. Score `0.0` when `Y` wins
    in both orders. Every other item scores `0.5`. This covers ties, one tie with one decisive verdict,
    and any pair where the two orders disagree. Inconsistent pairs count as ties.'
  killed_by: test_mixed_consistent_inconsistent_and_tie_items
  visible: public
