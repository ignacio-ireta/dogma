  mistake: clamps negative kappa to zero
  clause: Returns `kappa = (p_o - p_e) / (1 - p_e)` as a `float`. It is `1.0` for perfect agreement and
    can be negative.
  killed_by: test_random_label_sequences_match_the_sklearn_oracle
  visible: hidden
- file: reject_zero_division_not_guarded.py
  mistake: degenerate guard never fires, ZeroDivisionError instead
  clause: '**Degenerate case.** When `p_e == 1`, both raters gave the same single label to every item,
    so the denominator is zero. Raise `ValueError` with a message that says kappa is undefined. Do not
    return `nan`.'
  killed_by: test_one_label_for_every_item_is_undefined_not_nan
