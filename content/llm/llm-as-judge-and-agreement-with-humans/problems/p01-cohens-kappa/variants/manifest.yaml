- file: reject_last_label_dropped_from_chance.py
  mistake: leaves the last label out of the chance term
  clause: Let `p_a(l)` and `p_b(l)` be the fraction of items each rater gave label `l`. Expected agreement
    is `p_e = sum over labels l of p_a(l) * p_b(l)`.
  killed_by: test_two_of_four_agree_on_yes_gives_half
  visible: public
