  origin: freedom
  freedom: divides the sum by the element count instead of calling mean
- file: accept_maximum_for_positive_part.py
  origin: freedom
  freedom: uses torch.maximum for the positive part instead of (x + abs(x)) / 2
- file: accept_blind.py
