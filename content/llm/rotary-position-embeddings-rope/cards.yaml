cards:
  - id: llm/rotary-position-embeddings-rope#1
    type: qa
    front: Which tensors does RoPE rotate inside attention?
    back: The queries and the keys, shape (B, H, T, d). Values are never rotated.
  - id: llm/rotary-position-embeddings-rope#2
    type: qa
    front: In the half-split layout, which two features form pair i?
    back: Feature i and feature i + d/2, with theta_i = 10000 ** (-2 i / d).
  - id: llm/rotary-position-embeddings-rope#3
    type: qa
    front: At what position does the first new token of a cached decoding step get rotated?
    back: At position past_len, the number of tokens already in the KV cache, not at 0.
  - id: llm/rotary-position-embeddings-rope#4
    type: qa
    front: How do the half-split and interleaved layouts relate?
    back: They differ by a fixed permutation of the feature axis, pi = (0, 2, 4, ..., 1, 3, 5, ...).
  - id: llm/rotary-position-embeddings-rope#5
    type: qa
    front: What does linear position interpolation with scale s do to the position t?
    back: It replaces t by t / s, so every angle is compressed and the base 10000 is unchanged.
  - id: llm/rotary-position-embeddings-rope#6
    type: cloze
    text: "RoPE makes the query-key score depend only on the {{c1::position offset m - n}}."
