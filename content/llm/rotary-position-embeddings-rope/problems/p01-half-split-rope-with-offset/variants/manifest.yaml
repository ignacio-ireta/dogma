    width. Both have the same dtype.'
  killed_by: test_empty_batch_returns_empty_tensors
  visible: hidden
- file: reject_k_unshifted.py
  mistake: keys rotated from position zero, offset ignored for k
  clause: '`offset`: `int` (not `bool`) and at least 0. Token `t` (`0 <= t < T`) sits at absolute position
    `p_t = offset + t`.'
  killed_by: test_matches_complex_reference_on_seeded_tensors
  visible: hidden
- file: reject_frequency_divisor_half.py
  mistake: frequency exponent divides by half width instead of width
  clause: 'Frequencies: with `d/2` pairs, `theta_i = 10000 ** (-2 i / d)` for `i = 0, ..., d/2 - 1`.'
  killed_by: test_matches_complex_reference_on_seeded_tensors
  visible: hidden
- file: reject_sine_sign_flipped_top.py
  mistake: top half adds b sin instead of subtracting it
  clause: 'Rotation, with `a = x[..., :d/2]` and `b = x[..., d/2:]`, and the angle $\phi_{t,i} = p_t\,\theta_i$:
