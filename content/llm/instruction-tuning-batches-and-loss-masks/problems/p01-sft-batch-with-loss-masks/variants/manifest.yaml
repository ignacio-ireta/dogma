  killed_by: test_empty_prompt_is_rejected_with_value_error
  visible: public
- file: reject_empty_response_allowed.py
  mistake: lets an empty response through
  clause: '`response_ids` must have at least one token.'
  killed_by: test_invalid_pairs_raise_value_error
  visible: hidden
- file: reject_mask_from_token_values.py
  mistake: builds the attention mask from token values so a response token equal to pad id is masked
  clause: 'Let `n_i = len(prompt_i) + len(response_i)` and `L = max(n_i)`. Each row has length `L`. -
    `input_ids[i]` holds the prompt, then the response, then `pad_id` in the columns `n_i..L-1`. - `labels[i]`
    holds `-100` for columns `0..len(prompt_i)-1`, then the response ids, then `-100` in columns `n_i..L-1`.
    - `attention_mask[i]` holds `1` in columns `0..n_i-1` and `0` after. - The masks come from lengths,
    not from token values. A response token whose id equals `pad_id` is a real token: its label keeps
    its id and its attention mask is `1`.'
  killed_by: test_response_token_equal_to_pad_id_is_still_a_target
  visible: public
