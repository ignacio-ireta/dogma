- file: reject_packing_stops_at_first_misfit.py
  mistake: packing stops at the first chunk that does not fit instead of skipping it
  clause: 'All vector entries must be finite. Integer and float arrays are accepted; complex, boolean
    and object arrays are not. **Score.** `s_i = (q . v_i) / (|q| * |v_i|)`, the cosine similarity. Round
    each score to 9 decimal places before comparing, so that numerically equal scores are ties. **Ranking.**
    Sort chunks by the key `(-s_i, chunk_id)`. Equal scores are broken by the chunk id in ascending string
    order. Insertion order never decides a tie. **Candidates.** The first `min(k, m)` chunks in the ranking
    are the candidates. `k` counts candidates, not selected chunks. **Packing.** Walk the candidates in
    rank order. A chunk costs `len(text.split())` words. Add it if the running total plus its cost is
    at most `word_budget`. Otherwise skip it and keep going, so a shorter lower-ranked candidate can still
    fit. The budget counts chunk-text words only; ids, labels and the question are not counted. A chunk
    text may hold line breaks or runs of spaces: it is printed unchanged, and its cost is the number of
    words `str.split()` finds (`"a\nb"` costs 2). **Output.** A string built with `"\n".join` from these
    lines, in order: 1. `Context:` 2. one line per selected chunk, in rank order: `[<chunk id>] <chunk
    text exactly as given>` 3. an empty line 4. `Question: <query exactly as given>` With no selected
    chunks, the context block is empty and the output is `Context:`, an empty line, then the question
    line. **Errors.** Raise `TypeError` when `query` or any id or text is not a `str`, or when `k` or
    `word_budget` is not an `int` (bool is not accepted). Raise `ValueError` for a blank query, a non-numeric
    or non-finite array, a wrong shape or length mismatch, a zero-norm query or chunk vector, a duplicate
    or empty chunk id, `k < 1`, or `word_budget < 0`. Must not mutate inputs.'
  killed_by: test_chunk_that_does_not_fit_is_skipped_and_later_chunks_still_fit
  visible: public
