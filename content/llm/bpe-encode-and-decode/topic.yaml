id: llm/bpe-encode-and-decode
title: BPE encode and decode
tier: A
requires: [llm/bpe-merge-training]
aliases: [BPE encoding, merge ranks, apply merges, byte-level BPE, tokenizer decode, round trip, greedy longest match, subword tokenization]
objectives:
  - Encode a word by applying learned merges in rank order, with the lowest rank first and every occurrence merged
  - Decode a token list back to its word, and state why greedy longest-match gives a different segmentation
  - Explain why byte-level BPE must decode the bytes together, and verify encode and decode with a round-trip property test
minutes: {lesson: 12, practice: 20, min_viable: 15}
interview_angle: >-
  "How does your tokenizer split a new word?" is a practical question. The interviewer checks that you apply the merges in
  learned order and that you can explain byte-level decoding.
sources:
  - "paper: Sennrich, Haddow & Birch 2016, Neural Machine Translation of Rare Words with Subword Units (arXiv:1508.07909)"
  - "paper: Radford et al. 2019, Language Models are Unsupervised Multitask Learners (GPT-2)"
status: verified
