- file: reject_null_revenue_rows_dropped.sql
  mistake: sessions with no recorded revenue are removed before grouping
  clause: 'Input: one table, `sessions`. - `session_id`: BIGINT, unique. - `channel`: VARCHAR, never NULL.
    Lowercase names such as `ads`. - `device`: VARCHAR, never NULL. Either `''mobile''` or `''desktop''`.
    - `converted`: BOOLEAN, never NULL. TRUE when the session converted. - `revenue`: DOUBLE, may be NULL.
    The revenue recorded on the session. NULL means no revenue is recorded, and it adds nothing to a sum.'
  killed_by: test_fixture_answer_matches_the_pandas_computation
  visible: public
- file: reject_converted_counts_all_rows.sql
  mistake: converted sessions counted with COUNT so FALSE rows are included
  clause: 'Returns: one row per channel that has at least one session, with exactly these columns in this
    order: - `channel`: the channel name. - `sessions`: the number of sessions in the channel, on every
    device, converted or not. - `converted_sessions`: the number of those sessions with `converted = TRUE`.
    `0` when none. - `conversion_rate`: `converted_sessions / sessions` as a fraction (0.25 means 25%),
    rounded to 4 decimal places with `ROUND(x, 4)`. `0.0` when no session converted. Never NULL. - `mobile_revenue`:
    the sum of `revenue` over the channel''s mobile sessions, converted or not. `0.0` when the channel
    has no mobile session with a recorded revenue. Never NULL. - `desktop_revenue`: the same sum over
    the channel''s desktop sessions.'
  killed_by: test_fixture_answer_matches_the_pandas_computation
  visible: public
