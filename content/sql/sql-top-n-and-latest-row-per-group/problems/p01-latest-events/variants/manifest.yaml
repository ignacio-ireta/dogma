uncovered:
- clause: Do not change the input table.
  reason: a read-only SELECT cannot plausibly change the input table, and K0 requires a read-only query,
    so no wrong query breaks this bullet alone
- clause: 'Output columns, in order: `entity_id BIGINT`, `event_id BIGINT`, `occurred_at TIMESTAMP`, `payload
    VARCHAR`, `rank_in_entity BIGINT`.'
  reason: every test checks the column types first, so a wrong solution fails all of them
