    order. - `customer_running_total`: float64. The sum of that customer''s amounts up to and including
    this order, in sort order, accumulated in float64 (a float32 accumulator loses cents on large totals).'
  killed_by: test_random_orders_match_the_duckdb_window_oracle
  visible: hidden
- file: reject_float32_running_total.py
  mistake: amounts are downcast to float32 before the running total losing cents
  clause: 'Returns: a new `pandas.DataFrame` with one row per input row, sorted by `customer_id`, then
    `order_date`, then `order_id`, all ascending. Its index is a fresh 0 to n-1 RangeIndex. Its columns,
