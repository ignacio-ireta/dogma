problem_version: 5
accept:
- file: accept_blind.py
  origin: blind
- file: accept_int64_output.py
  origin: freedom
  freedom: returns int64 labels whatever the integer width of y_train
reject:
- file: reject_returns_float_array.py
  mistake: returns float values where the Contract promises integer labels
  clause: 'Returns: a 1-D integer array of shape `(m,)` containing a label from `y_train` for each query
    row.'
  killed_by: test_returned_array_holds_integer_labels
  visible: hidden
- file: reject_xtrain_rejects_lists.py
  mistake: rejects a valid list for the training features and accepts only arrays
  clause: '`X_train`: 2-D array-like of finite numbers, shape `(n, d)`, with $n \ge 1$ and $d \ge 1$.'
  killed_by: test_majority_vote_among_the_three_nearest_rows
  visible: public
- file: reject_negative_labels_fail.py
  mistake: refuses negative labels although the Contract allows any integers
  clause: '`y_train`: 1-D array-like of integer class labels, shape `(n,)`. Labels may be any integers,
    including negative ones.'
  killed_by: test_matches_brute_force_reference_on_random_float_data
  visible: hidden
- file: reject_query_columns_unchecked.py
  mistake: skips the query column-count check so a one-column query is broadcast
  clause: '`X_query`: 2-D array-like of finite numbers, shape `(m, d)`, with the same `d` as `X_train`.
    $m = 0$ is allowed.'
  killed_by: test_invalid_shapes_dtypes_and_values_raise_value_error
  visible: hidden
- file: reject_bool_k_accepted.py
  mistake: accepts a boolean as k
  clause: '`k`: integer, with $1 \le k \le n$. Booleans are not integers here.'
  killed_by: test_invalid_k_raises_value_error
  visible: hidden
- file: reject_float_labels_accepted.py
  mistake: accepts float labels that the Contract rejects
  clause: 'Raises: `ValueError` when `k` is not an integer or is outside $[1, n]$, when an array is not
    2-D or 1-D as required, when the column counts differ, when `y_train` does not have an integer dtype
    (floats such as `[0.0, 1.0]` are rejected), or when a feature is not finite.'
  killed_by: test_invalid_shapes_dtypes_and_values_raise_value_error
  visible: hidden
- file: reject_distance_overflows.py
  mistake: computes distances by squaring so very large features overflow
  clause: Features may be as large as `1e200`. Compare distances without overflow, so that unequal finite
    distances never tie.
  killed_by: test_large_finite_distances_keep_the_nearest_neighbour_order
  visible: hidden
- file: reject_mutates_training_features.py
  mistake: centres the caller's float arrays in place
  clause: Must not mutate inputs.
  killed_by: test_matches_brute_force_reference_on_random_small_integer_data
  visible: hidden
- file: reject_returns_a_list_for_the_array.py
  mistake: returns a nested list of the right numbers where a NumPy array is promised
  clause: 'Returns: a 1-D integer array of shape `(m,)` containing a label from `y_train` for each query
    row.'
  killed_by: test_predicted_labels_come_back_as_a_numpy_array
  visible: hidden
uncovered: []
sweeps:
- reject
- mutants
