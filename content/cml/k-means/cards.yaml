cards:
  - id: cml/k-means#1
    type: qa
    front: What objective does Lloyd's algorithm reduce?
    back: The inertia, the within-cluster sum of squared distances from each sample to its centroid.
  - id: cml/k-means#2
    type: qa
    front: Why is the centroid update the mean of the cluster's samples?
    back: The mean minimises the sum of squared distances to a point. Setting the derivative to zero gives it.
  - id: cml/k-means#3
    type: cloze
    text: "Lloyd's algorithm is {{c1::alternating minimisation}}: assign each sample to its nearest centroid, then move each centroid to the mean of its samples."
  - id: cml/k-means#4
    type: qa
    front: Why does Lloyd's algorithm converge?
    back: Neither step can increase the inertia, and the inertia is bounded below by zero over a finite number of partitions.
  - id: cml/k-means#5
    type: qa
    front: With what probability does k-means++ choose the next centre?
    back: Proportional to the squared distance from each sample to its nearest centre chosen so far.
  - id: cml/k-means#6
    type: qa
    front: What guarantee does k-means++ seeding give in expectation?
    back: Its cost is within an O(log k) factor of the optimal inertia (Arthur and Vassilvitskii, 2007).
  - id: cml/k-means#7
    type: qa
    front: Why does k-means split concentric rings?
    back: Each cluster is a Voronoi cell bounded by straight bisectors, which cannot follow a curved, non-spherical shape.
