- file: reject_absolute_cutoff.py
  mistake: uses rcond as an absolute cutoff instead of a fraction of the largest singular value
  clause: 'Cutoff: let `s_max` be the largest singular value of `A`. Every singular value `s_i <= rcond
    * s_max` is treated as zero. The others are inverted. This is the rule of `numpy.linalg.pinv(A, rcond=rcond)`.
    The cutoff is relative to `s_max`, not absolute. If `A` is the zero matrix, every singular value is
    zero and the result is the zero matrix.'
  killed_by: test_cutoff_is_relative_to_the_largest_singular_value
  visible: public
- file: reject_float32_result.py
  mistake: returns single precision float32 instead of float64
  clause: 'Returns: a float64 array of shape `(n, m)`, equal to `V diag(s_plus) U^T`, where `s_plus_i
    = 1 / s_i` for kept singular values and `0` otherwise.'
  killed_by: test_rank_one_matrix_drops_the_zero_singular_value
  visible: public
- file: reject_negative_rcond_accepted.py
  mistake: accepts a negative rcond
  clause: Raises `ValueError` when `A` is not 2-D, is empty, contains NaN or infinity, or when `rcond`
