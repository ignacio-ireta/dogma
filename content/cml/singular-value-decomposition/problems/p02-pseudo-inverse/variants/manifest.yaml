- file: reject_rcond_bool_accepted.py
  mistake: accepts True as rcond, treating a bool as the number 1
  clause: '`rcond`: keyword-only, a finite real number `>= 0`, default `1e-15`. Booleans are rejected.'
  killed_by: test_invalid_matrix_or_rcond_raises_value_error
