problem_version: 5
accept:
- file: accept_blind.py
  origin: blind
- file: accept_sum_order.py
  origin: freedom
  freedom: sums the absolute residuals in reverse order, a different rounding path
reject:
- file: reject_deduplicate_targets.py
  mistake: drops rows whose target value repeats before scoring
  clause: 'Returns: a `dict` with exactly the keys `"mae"`, `"mse"`, `"rmse"` and `"r2"`, each a Python
    float. - `mae` = (1/n) Σ |yᵢ − ŷᵢ| - `mse` = (1/n) Σ (yᵢ − ŷᵢ)² - `rmse` = √`mse` - `r2` = 1 − Σ (yᵢ
    − ŷᵢ)² / Σ (yᵢ − ȳ)², where ȳ is the mean of `y_true`. `r2` is not clipped, so it can be negative.'
  killed_by: test_repeated_target_values_all_count_toward_the_mean
  visible: hidden
- file: reject_int_y_true.py
  mistake: refuses integer y_true
  clause: '`y_true`: 1-D array-like of finite real numbers, length n ≥ 1.'
  killed_by: test_integer_inputs_give_the_same_scores_as_floats
  visible: hidden
- file: reject_int_y_pred.py
  mistake: refuses integer y_pred
  clause: '`y_pred`: 1-D array-like of finite real numbers, the same length n.'
  killed_by: test_integer_inputs_give_the_same_scores_as_floats
  visible: hidden
- file: reject_r2_centred_on_prediction.py
  mistake: R2 centres y_true on the mean of y_pred
  clause: 'Returns: a `dict` with exactly the keys `"mae"`, `"mse"`, `"rmse"` and `"r2"`, each a Python
    float. - `mae` = (1/n) Σ |yᵢ − ŷᵢ| - `mse` = (1/n) Σ (yᵢ − ŷᵢ)² - `rmse` = √`mse` - `r2` = 1 − Σ (yᵢ
    − ŷᵢ)² / Σ (yᵢ − ȳ)², where ȳ is the mean of `y_true`. `r2` is not clipped, so it can be negative.'
  killed_by: test_worked_example_gives_hand_computed_scores
  visible: public
- file: reject_nan_check_skips_prediction.py
  mistake: finite check ignores y_pred
  clause: Raises `ValueError` when an input is not 1-D; when the lengths differ; when the input is empty;
    when any value is NaN or infinite; or when every `y_true` value is equal. In that last case the denominator
    of R² is zero and R² is undefined.
  killed_by: test_non_finite_values_raise_value_error
  visible: hidden
- file: reject_unscaled_sum_of_squares.py
  mistake: R2 sums squares without rescaling so tiny targets underflow
  clause: Compute the sums of squares without underflow. `y_true = [-1e-200, 0, 1e-200]` is not constant,
    so its `r2` is defined even though the squares underflow.
  killed_by: test_r2_remains_defined_when_nonconstant_target_squares_underflow
  visible: hidden
- file: reject_sorts_prediction_in_place.py
  mistake: sorts the caller y_pred array in place
  clause: Must not mutate inputs.
  killed_by: test_inputs_are_not_mutated
  visible: hidden
- file: reject_takes_abs_of_y_true_in_place.py
  mistake: returns the right result and replaces the caller's y_true by its absolute values in place
  clause: Must not mutate inputs.
  killed_by: test_read_only_input_arrays_are_accepted_and_left_alone
  visible: hidden
uncovered: []
sweeps:
- reject
- mutants
