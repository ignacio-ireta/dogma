problem_version: 7
accept:
- file: accept_blind.py
  origin: blind
- file: accept_loop_sums.py
  origin: freedom
  freedom: lag sums and the denominator added one product at a time in a Python loop, not with a dot product,
    so only the last digits differ
reject:
- file: reject_mutates_caller_array.py
  mistake: writes the centred values into the caller's float array
  clause: '`x`: 1-D sequence of finite real numbers (list, tuple or NumPy array), length n >= 2. Integers
    are allowed, and their mean is the exact real mean: it is never rounded or floor-divided. float32
    arrays are allowed too: the sums are done in float64 on the stored values. Must not be mutated.'
  killed_by: test_inputs_are_not_mutated
  visible: hidden
- file: reject_floors_integer_mean.py
  mistake: centres by a floor-divided mean
  clause: '`x`: 1-D sequence of finite real numbers (list, tuple or NumPy array), length n >= 2. Integers
    are allowed, and their mean is the exact real mean: it is never rounded or floor-divided. float32
    arrays are allowed too: the sums are done in float64 on the stored values. Must not be mutated.'
  killed_by: test_three_lags_match_hand_computed_values
  visible: public
- file: reject_accepts_float_nlags.py
  mistake: accepts a float or bool nlags
  clause: '`nlags`: integer with 0 <= nlags <= n - 1. A bool or a float is rejected.'
  killed_by: test_invalid_nlags_raises_value_error
  visible: hidden
- file: reject_returns_float32.py
  mistake: returns float32 instead of float64
  clause: 'Returns: a float64 array of length `nlags + 1`. Entry k is the autocorrelation at lag k, and
    entry 0 is exactly 1.'
  killed_by: test_three_lags_match_hand_computed_values
  visible: public
- file: reject_constant_check_uses_mean.py
  mistake: misses a constant series whose mean is not exact
  clause: Raises `ValueError` when `x` is not 1-D, has fewer than two values, or contains NaN or infinity;
    when `nlags` is not an integer in 0 .. n - 1; or when `x` is constant (every value equal), because
    the autocorrelation is then undefined. With `d_t = x_t - mean(x)`, the autocorrelation at lag k is
    r_k = (sum over t = 0 .. n-k-1 of d_t * d_(t+k)) / (sum over t = 0 .. n-1 of d_t^2)
  killed_by: test_constant_series_raises_value_error
  visible: hidden
- file: reject_adjusted_denominator.py
  mistake: divides each lag by its number of pairs
  clause: 'Returns: a float64 array of length `nlags + 1`. Entry k is the autocorrelation at lag k, and
    entry 0 is exactly 1.'
  killed_by: test_three_lags_match_hand_computed_values
  visible: public
- file: reject_scale_by_smallest_reading.py
  mistake: huge readings of opposite sign make the autocorrelation infinite or NaN
  clause: 'Returns: a float64 array of length `nlags + 1`. Entry k is the autocorrelation at lag k, and
    entry 0 is exactly 1.'
  killed_by: test_huge_readings_of_opposite_sign_give_finite_autocorrelations
  visible: hidden
- file: reject_lag_zero_sums_differ.py
  mistake: adds the lag sums in a Python loop but the denominator with a dot product, so lag 0 is not
    exactly one on some series
  clause: 'Returns: a float64 array of length `nlags + 1`. Entry k is the autocorrelation at lag k, and
    entry 0 is exactly 1.'
  killed_by: test_lag_zero_is_exactly_one_on_random_series
  visible: hidden
- file: reject_rounds_x_in_place.py
  mistake: returns the right result and rounds the caller's x to six decimals in place
  clause: '`x`: 1-D sequence of finite real numbers (list, tuple or NumPy array), length n >= 2. Integers
    are allowed, and their mean is the exact real mean: it is never rounded or floor-divided. float32
    arrays are allowed too: the sums are done in float64 on the stored values. Must not be mutated.'
  killed_by: test_read_only_input_arrays_are_accepted_and_left_alone
  visible: hidden
uncovered: []
sweeps:
- reject
- mutants
