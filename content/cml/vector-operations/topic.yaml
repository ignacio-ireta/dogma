id: cml/vector-operations
title: Vector operations
tier: A
requires: []
aliases: [dot product, inner product, vector norm, projection, linear combination, angle between vectors]
objectives:
  - Compute dot products, norms and the angle between vectors with NumPy, by hand and in code
  - Implement the orthogonal projection of one vector onto another, rejecting the zero vector
  - Explain the geometric meaning of the dot product and why projection underlies least squares
minutes: {lesson: 12, practice: 20, min_viable: 15}
interview_angle: >-
  Rarely asked directly, but it's the vocabulary for everything else: cosine similarity in
  retrieval, projections in regression and PCA, attention scores as dot products.
sources:
  - "book: Strang, Introduction to Linear Algebra (5th ed.), §1.1–1.2 and §4.2"
  - "book: Deisenroth, Faisal & Ong, Mathematics for Machine Learning, §3.1–3.8"
status: reviewed
