id: cml/normal-equation
title: Normal equation
tier: A
requires: [cml/vector-operations, cml/matrix-inverse-and-rank, cml/partial-derivatives-and-gradients]
aliases: [least squares, normal equations, linear regression, design matrix, hat matrix, ordinary least squares, dummy-variable trap]
objectives:
  - Derive the normal equations by setting the gradient of the squared error to zero, and read them as an orthogonal projection
  - Implement least-squares regression with an intercept by solving the normal equations, rejecting rank-deficient designs
  - Explain why forming X^T X squares the condition number, and when QR or lstsq is the safer choice
minutes: {lesson: 12, practice: 25, min_viable: 15}
interview_angle: >-
  "Derive the least-squares solution, and tell me when you would not use it."
  A strong answer shows the projection, names the rank condition, and explains the squared condition number.
sources:
  - "book: Strang, Introduction to Linear Algebra (5th ed.), chapter on orthogonality (projections and least squares)"
  - "book: Hastie, Tibshirani & Friedman, The Elements of Statistical Learning, chapter on linear methods for regression"
  - "book: Trefethen & Bau, Numerical Linear Algebra, lecture on least squares"
  - "source: library-refresh/01-Mathematics/05-Linear-Algebra/1955-1970 -- Penrose, Golub and Reinsch -- Least Squares, Pseudoinverses and Numerical Stability -- Concept Note.md"
  - "source: library-refresh/01-Mathematics/05-Linear-Algebra/2024 -- Axler -- Vector Spaces, Inner Products and Representation Geometry -- Study Note.md"
status: verified
