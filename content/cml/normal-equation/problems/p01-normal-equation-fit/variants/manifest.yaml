  clause: '`fit_intercept`: bool, default `True`.'
  killed_by: test_exact_line_recovers_intercept_and_slope
  visible: public
- file: reject_coef_scalar_for_one_column.py
  mistake: returns coef as a bare scalar when there is one feature
  clause: 'Returns: `(intercept, coef)`. `intercept` is a Python float, and it is `0.0` when `fit_intercept`
    is false. `coef` is a float64 array of shape (d,).'
  killed_by: test_exact_line_recovers_intercept_and_slope
  visible: public
- file: reject_rank_on_normal_matrix.py
  mistake: checks the rank of the normal matrix instead of the design so a full-rank ill-conditioned design
    is refused
  clause: 'Raises `ValueError` when `X` is not 2-D; when `y` is not 1-D or has a different length from
    `X`; when `X` or `y` contains NaN or infinity; when the design matrix is rank deficient. The rank
    is the one NumPy computes with `np.linalg.matrix_rank` and its default tolerance. This covers a column
    that is a multiple or a sum of others, a zero column, a constant column when `fit_intercept` is true,
    and fewer rows than columns. A full-rank design is fitted however large its condition number is: a
    real economic design with an intercept can have a condition number near 10^10 and must still be fitted.'
  killed_by: test_full_rank_real_design_with_large_condition_is_fitted
  visible: hidden
- file: reject_finite_check_skips_y.py
  mistake: checks only X for non-finite values and lets an infinite y through
