id: cml/principal-component-analysis
title: Principal component analysis
tier: A
requires: [cml/covariance-and-correlation, cml/eigenvalues-and-eigenvectors]
aliases: [PCA, principal axes, principal components, explained variance, scree plot, whitening, loadings, scores]
objectives:
  - Implement PCA from the SVD of the centred data, with explained variance (divisor n - 1), ratios over the total variance, and a stated sign convention
  - Explain why the maximum-variance directions are covariance eigenvectors and right singular vectors of the centred data
  - Choose the number of components from the cumulative explained-variance ratio, and state the limits of that rule
minutes: {lesson: 12, practice: 20, min_viable: 15}
interview_angle: >-
  The usual sequence is "what does PCA maximise", then "how would you compute it", then "when would you not use it".
  Answer with the SVD of the centred data, when to standardise, and the failure modes.
sources:
  - "book: Deisenroth, Faisal & Ong, Mathematics for Machine Learning, ch. 10 (dimensionality reduction with PCA)"
  - "book: Bishop, Pattern Recognition and Machine Learning, §12.1 (principal component analysis)"
  - "library: Mathematics/07-Multivariate-Statistics/Pearson - Principal Components 1901.md"
  - "library: Mathematics/07-Multivariate-Statistics/Hotelling - Principal Components 1933.md"
  - "source: library-refresh/01-Mathematics/05-Linear-Algebra/1955-1970 -- Penrose, Golub and Reinsch -- Least Squares, Pseudoinverses and Numerical Stability -- Concept Note.md"
