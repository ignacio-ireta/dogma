cards:
  - id: cml/k-fold-cross-validation#1
    type: qa
    front: How many model fits does ordinary k-fold cross-validation need?
    back: k fits, with each fold held out once.
  - id: cml/k-fold-cross-validation#2
    type: qa
    front: With n = 10 and k = 3, what are the test-fold sizes?
    back: "4, 3, 3. The first n % k folds each take one extra row."
  - id: cml/k-fold-cross-validation#3
    type: cloze
    text: "Unshuffled folds are {{c1::consecutive blocks of positions}}, so each fold's test rows are contiguous."
  - id: cml/k-fold-cross-validation#4
    type: qa
    front: What does a stratified split preserve across folds?
    back: Class proportions in each fold, as closely as integer counts allow.
  - id: cml/k-fold-cross-validation#5
    type: qa
    front: What does a grouped split guarantee within each split?
    back: No group, such as a patient or a user, has rows in both the training part and the test part.
  - id: cml/k-fold-cross-validation#6
    type: qa
    front: Why is the best cross-validated score overstated after tuning on the same folds?
    back: The winner is chosen because its noise in the folds happened to be favourable, so its score is biased upward.
  - id: cml/k-fold-cross-validation#7
    type: cloze
    text: "Nested cross-validation tunes in an {{c1::inner loop}} and scores the whole procedure in an {{c2::outer loop}}."
  - id: cml/k-fold-cross-validation#8
    type: qa
    front: Which standard deviation describes the spread of k fold scores, and what is its divisor?
    back: The sample standard deviation with divisor k − 1 (ddof = 1).
