  mistake: list logits rejected although the Contract accepts array-likes
  clause: '`logits`: 2-D array-like of shape `(n, k)` with $n \ge 1$ and $k \ge 2$. Every entry is finite.'
  killed_by: test_list_logits_are_accepted_as_array_like
  visible: hidden
- file: reject_int8_targets.py
  mistake: targets narrowed to int8 so class indices above 127 wrap
  clause: '`targets`: 1-D array of shape `(n,)` with an **integer** dtype. Every entry lies in `[0, k)`.'
  killed_by: test_class_indices_above_127_are_not_wrapped_by_a_narrow_integer
  visible: hidden
- file: reject_float32_grad.py
  mistake: gradient returned as float32 instead of float64
  clause: 'Returns: a tuple `(loss, grad)`. `loss` is a Python `float`. `grad` is a `float64` array of
    shape `(n, k)`.'
  killed_by: test_skewed_logits_match_the_log_sum_exp_value
  visible: public
- file: reject_no_overflow_branch.py
  mistake: overflow fix for an unrepresentable true-class gap removed so the mean is lost
  clause: Each row of `grad` sums to zero. Representable mean losses must remain finite even when an intermediate
    sum or an individual logit difference would overflow. Return `+inf` without a warning only when the
    mean loss itself exceeds float64 range.
  killed_by: test_batch_mean_can_be_finite_even_when_one_true_class_gap_is_not
  visible: hidden
- file: reject_off_by_one_target_range.py
  mistake: target upper bound off by one so a target equal to k is not rejected as ValueError
  clause: 'Raises `ValueError` when: `logits` is not a non-empty 2-D array; `k < 2`; any logit is NaN
    or infinite; `targets` is not 1-D of length `n`; `targets` does not have an integer dtype; or any
    target is outside `[0, k)`.'
  killed_by: test_invalid_inputs_raise_value_error
  visible: hidden
- file: reject_inplace_shift.py
  mistake: logits shifted in place so the caller's array is changed
  clause: Must not mutate its inputs. Must not emit a NumPy overflow, invalid-value or divide warning
    for any finite logits.
  killed_by: test_inputs_are_not_mutated
  visible: hidden
