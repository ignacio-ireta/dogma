- file: reject_midpoint_overflows.py
  mistake: median midpoint of two large values overflows
  clause: 'Let `median` be the median of `x` (the mean of the two middle values for an even count), and
    `MAD` the median of `|x - median|`. Compute each midpoint without overflow when its exact value is
    finite: the median of `1.6e308` and `1.7e308` is `1.65e308`.'
  killed_by: test_midpoint_of_two_huge_same_sign_values_does_not_overflow
  visible: hidden
- file: reject_overflowed_difference_not_recomputed.py
  mistake: overflowing difference is not recomputed, so its score is lost
  clause: The modified z-score is `M = 0.6745 * (x - median) / MAD`, computed element by element. The
    difference `x - median` can overflow for finite values such as `-1.7e308` and `1.5e308`. `M` is still
    representable there, and it must be correct.
  killed_by: test_raw_deviation_that_overflows_still_gets_its_modified_score
  visible: hidden
- file: reject_non_strict_threshold.py
  mistake: compares with greater-or-equal instead of strictly greater
  clause: 'Returns a boolean array of the same length as `x`: `True` where `|M| > threshold` (strictly
