  killed_by: test_comparison_is_strict_at_the_threshold
  visible: hidden
- file: reject_zero_mad_flags_only_above.py
  mistake: zero MAD flags only values above the median
  clause: '**Zero MAD.** When `MAD` is exactly `0`, the score is undefined. In that case a value is flagged
    exactly when it differs from `median`. A value equal to the median is never flagged.'
  killed_by: test_zero_mad_flags_values_different_from_the_median_only
  visible: hidden
- file: reject_infinite_threshold_accepted.py
  mistake: an infinite threshold is accepted instead of raising
