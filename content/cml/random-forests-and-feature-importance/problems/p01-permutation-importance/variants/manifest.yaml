problem_version: 3
accept:
- file: accept_blind.py
  origin: blind
reject:
- file: reject_drop_sign_flipped.py
  mistake: drop recorded as permuted score minus baseline so the sign flips
  clause: 'Returns: `(mean_drop, std_drop)`, two `float64` arrays of shape `(d,)`. A positive mean means
    the feature helps the model.'
  killed_by: test_matches_an_independent_loop_that_follows_the_protocol
  visible: hidden
- file: reject_finite_check_dropped.py
  mistake: finite check on X dropped so NaN is accepted
  clause: '`X`: 2-D array-like of finite numbers, shape `(n, d)`, with $n \ge 1$ and $d \ge 1$.'
  killed_by: test_non_finite_x_raises_value_error
  visible: hidden
- file: reject_repeat_outer_loop.py
  mistake: repeat loop outside feature loop so draws come in the wrong order
  clause: '**Protocol (exact, so results are reproducible):** 1. `baseline = metric(y, predict(X))`. 2.
    Create one generator, `rng = np.random.default_rng(seed)`, and use it for everything that follows.
    3. For each feature `j` in order `0, 1, ..., d-1`, and for each repeat `r` in order `0, ..., n_repeats-1`:
    draw `perm = rng.permutation(n)`, copy `X`, replace column `j` with `X[perm, j]` and leave the other
    columns as they are. Record `drop[j, r] = baseline - metric(y, predict(X_perm))`. 4. `mean_drop[j]`
    is the mean of `drop[j, :]`. `std_drop[j]` is the **population** standard deviation of `drop[j, :]`
    (divide by $n_{\text{repeats}}$, not by $n_{\text{repeats}}-1$).'
  killed_by: test_matches_an_independent_loop_that_follows_the_protocol
  visible: hidden
- file: reject_y_ndim_unchecked.py
  mistake: two-dimensional y accepted when its length matches
  clause: '`y`: 1-D array-like of length `n`.'
  killed_by: test_two_dimensional_y_raises_value_error
  visible: hidden
- file: reject_zero_repeats_accepted.py
  mistake: zero repeats accepted instead of raising
  clause: '`n_repeats`: keyword-only integer, at least 1. `seed`: keyword-only non-negative integer.'
  killed_by: test_zero_repeats_raise_value_error
  visible: hidden
- file: reject_metric_args_swapped.py
  mistake: metric called with predictions before targets
  clause: '`metric`: a callable `metric(y_true, y_pred)` that returns a number. Larger is better, as for
    accuracy or $R^2$.'
  killed_by: test_metric_is_called_with_true_targets_first
  visible: hidden
- file: reject_predict_list_rejected.py
  mistake: predict output that is a plain list rejected
  clause: '`predict`: a callable that takes a 2-D float array of shape `(n, d)` and returns `n` predictions,
    as a 1-D array-like.'
  killed_by: test_plain_list_predictions_are_accepted
  visible: hidden
- file: reject_float32_cast.py
  mistake: X is cast to a smaller float type, so very large finite entries become infinite and the call
    rejects valid input
  clause: '`X`: 2-D array-like of finite numbers, shape `(n, d)`, with $n \ge 1$ and $d \ge 1$.'
  killed_by: test_huge_finite_entries_are_accepted_and_ignored_column_has_no_drop
  visible: hidden
uncovered:
- clause: 'Raises: `ValueError` when `X` is not a non-empty 2-D finite array; when `y` is not 1-D or has
    a different length from `X`; when `n_repeats` is not an integer of at least 1; when `seed` is not
    a non-negative integer; and when `predict` does not return one prediction per row.'
  reason: wrong solution survives, see notes
- clause: Must not mutate `X` or `y`.
  reason: cap of eight wrong solutions per problem
sweeps:
- reject
- mutants
