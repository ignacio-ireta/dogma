  origin: blind
reject:
- file: reject_cap_levels_at_ten.py
  mistake: caps the categories at the ten most frequent levels and drops the rest
  clause: 'Must not mutate `train` or `test`. **Protocol (exact).** *Numeric column.* 1. Median of the
    observed training values. The median is the usual one, the mean of the two middle values for an even
    count. 2. Fill every missing value in `train` and `test` with that training median. 3. Let `mean`
    and `scale` be the mean and the population standard deviation (denominator `n`) of the filled training
    column. If the filled training column is constant (its maximum equals its minimum), `scale` is `1.0`.
    Compute both without overflow or underflow: columns of values near `1e200` or `1e-200` still have
    a finite, nonzero `scale`. 4. Transform both columns with `(x - mean) / scale`. *Categorical column.*
    1. Mode of the observed training values. Ties go to the smallest value. 2. Fill every missing value
    in `train` with that mode. 3. `categories` are the sorted distinct values of the filled training column,
    however rare: a level seen once in train gets its own column. 4. A row gets a `1.0` in the column
    of its category and `0.0` in the others. In `test`, a missing value is treated as the training mode.
    A value that is not in `categories` gives an all-zero block.'
  killed_by: test_matches_column_transformer_on_real_adult_with_rare_and_unseen_countries
  visible: hidden
- file: reject_categorical_blocks_sorted.py
  mistake: emits one-hot blocks in sorted column-name order instead of the order given
