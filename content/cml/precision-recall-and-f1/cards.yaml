cards:
  - id: cml/precision-recall-and-f1#1
    type: cloze
    text: "F1 = 2PR / (P + R), which is equal to {{c1::2TP / (2TP + FP + FN)}}."
  - id: cml/precision-recall-and-f1#2
    type: qa
    front: "Why is F1 a harmonic mean rather than an arithmetic mean?"
    back: "The harmonic mean is pulled toward the smaller value and is 0 when either precision or recall is 0."
  - id: cml/precision-recall-and-f1#3
    type: qa
    front: "What does F-beta do when beta is greater than 1?"
    back: "It emphasizes recall: the count formula weights FN by beta squared relative to FP."
  - id: cml/precision-recall-and-f1#4
    type: qa
    front: "For single-label multi-class data, what does micro-averaged F1 equal?"
    back: "Accuracy, because pooling the counts over classes gives the share of correct predictions."
  - id: cml/precision-recall-and-f1#5
    type: qa
    front: "How does macro averaging differ from weighted averaging?"
    back: "Macro gives every class equal weight. Weighted averaging weights each class by its true support."
  - id: cml/precision-recall-and-f1#6
    type: qa
    front: "Is macro F1 equal to the harmonic mean of macro precision and macro recall?"
    back: "No, in general. Macro F1 is the mean of the per-class F1 values."
  - id: cml/precision-recall-and-f1#7
    type: qa
    front: "Is binary F1 invariant to swapping the positive class?"
    back: "No. It can change because it uses the chosen class's TP, FP and FN, while ignoring its TN."
