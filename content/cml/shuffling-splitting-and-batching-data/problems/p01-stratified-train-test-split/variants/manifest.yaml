- file: reject_stratify_relabelled_in_place.py
  mistake: stratify labels relabelled in place
  clause: 'Must not mutate `stratify`. **Protocol (exact).** Every product below is a float64 product
    evaluated as written, and `ceil` and `floor` act on those floats. Let `n_test = ceil(test_size * n)`.
    The test side gets exactly `n_test` rows. Float64 matters: `0.07 * 100` is `7.000000000000001`, so
    `n_test` is 8, which is also the count scikit-learn gives. Exact decimal arithmetic would give 7,
    and that is wrong for this protocol. *Without `stratify`:* 1. Create `rng = np.random.default_rng(seed)`
    once. 2. Draw `perm = rng.permutation(n)`. This is the only draw. 3. `test_idx` is the sorted `perm[:n_test]`,
    and `train_idx` is the sorted `perm[n_test:]`. *With `stratify` (labels `y`):* 1. Create `rng = np.random.default_rng(seed)`
    once, before any draw. 2. The classes are the distinct labels in ascending order, `c_1 < ... < c_k`.
    Let `n_j` be the number of rows with label `c_j`. 3. Allocate test rows per class. Let `ideal_j =
    test_size * n_j` (float64) and `base_j = floor(ideal_j)`. Let `R = n_test - sum(base_j)`. The `R`
    classes with the largest fractional parts `ideal_j - base_j` each get one extra test row. Ties in
    the fractional part go to the class that comes first in ascending order. Call the result `t_j`. 4.
    If some class has `t_j >= n_j`, raise `ValueError`, before any draw. 5. For `j = 1..k` in ascending
    order, draw `perm_j = rng.permutation(rows_j)`, where `rows_j` is the ascending row indices of class
    `j`. That is exactly `k` draws. 6. The first `t_j` entries of `perm_j` are test rows; the rest are
    training rows. 7. `test_idx` and `train_idx` are the unions over all classes, each sorted ascending.'
  killed_by: test_labels_and_stratify_input_are_not_mutated
  visible: hidden
