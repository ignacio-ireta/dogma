  killed_by: test_zero_matrix_raises_value_error
  visible: hidden
- file: reject_no_finite_check.py
  mistake: no check for NaN or infinite entries
  clause: Raises `ValueError` when `A` is not 2-D, when it is not square, when it is empty, when it contains
    NaN or infinity, or when it is singular as defined above.
  killed_by: test_nan_entry_raises_value_error
  visible: hidden
- file: reject_rejects_tuple_input.py
  mistake: refuses tuple input, which is a valid array-like
