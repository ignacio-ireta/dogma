problem_version: 3
accept:
- file: accept_blind.py
  origin: blind
- file: accept_loop_gram.py
  origin: freedom
  freedom: loop over rows to build the Gram matrix and right hand side instead of matrix products
reject:
- file: reject_alpha_zero_epsilon.py
  mistake: alpha zero must give exact least squares, not a small positive penalty in its place
  clause: '`alpha`: a finite real number ≥ 0, the penalty strength.'
  killed_by: test_alpha_zero_gives_exact_least_squares_on_a_nearly_collinear_design
  visible: hidden
- file: reject_rank_check_uncentred.py
  mistake: alpha zero with an intercept must check rank after centring, not on raw X
  clause: '`alpha = 0` gives ordinary least squares. That needs a full-rank design: the centred X̃ when
    `fit_intercept` is true, and X otherwise. Raise `ValueError` if it is rank deficient.'
  killed_by: test_alpha_zero_with_intercept_checks_the_rank_after_centring
  visible: hidden
- file: reject_integer_x_floor_mean.py
  mistake: integer X gets a floored mean
  clause: '`X`: 2-D array-like of shape (n, d), n ≥ 1, d ≥ 1, finite real numbers. Integers allowed.'
  killed_by: test_integer_inputs_give_the_same_fit_as_floats
  visible: hidden
- file: reject_integer_y_floor_mean.py
  mistake: integer y gets a floored mean
  clause: '`y`: 1-D array-like of shape (n,), finite real numbers.'
  killed_by: test_integer_inputs_give_the_same_fit_as_floats
  visible: hidden
- file: reject_no_intercept_centres_x.py
  mistake: with no intercept X is still centred
  clause: '`fit_intercept`: bool, default `True`. When `False`, the intercept is fixed at 0 and the problem
    is ‖y − Xβ‖² + α‖β‖².'
  killed_by: test_matches_scikit_learn_ridge_without_intercept
  visible: hidden
- file: reject_coef_float32.py
  mistake: coefficients come back as float32 on the intercept path
  clause: 'Returns: `(intercept, coef)`. `intercept` is a Python float, and it is `0.0` when `fit_intercept`
    is false. `coef` is a float64 array of shape (d,).'
  killed_by: test_matches_scikit_learn_ridge_with_intercept
  visible: hidden
- file: reject_intercept_median.py
  mistake: intercept uses the median of y not its mean
  clause: 'With `fit_intercept` true, centre the data: X̃ = X − x̄ and ỹ = y − ȳ. Then β = (X̃ᵀX̃ + αI)⁻¹
    X̃ᵀỹ and b₀ = ȳ − x̄ᵀβ. With `fit_intercept` false, β = (XᵀX + αI)⁻¹ Xᵀy.'
  killed_by: test_worked_example_with_penalty_two_shrinks_the_slope_to_a_quarter
  visible: public
- file: reject_empty_rows_allowed.py
  mistake: an X with no rows is accepted
  clause: Raises `ValueError` when `X` has no rows or no columns; when `X` is not 2-D; when `y` is not
    1-D or its length differs from the number of rows of `X`; when `X`, `y` or `alpha` contains a non-finite
    value; when `alpha < 0`; or when `alpha = 0` with a rank-deficient design. Use `np.linalg.matrix_rank`
    with its default tolerance.
  killed_by: test_empty_design_dimensions_raise_value_error
  visible: hidden
uncovered:
- clause: Must not mutate inputs.
  reason: cap of eight wrong solutions per problem
sweeps:
- reject
- mutants
