  killed_by: test_random_inputs_match_sorted_score_oracle
  visible: hidden
- file: reject_alpha_binary_value_read.py
  mistake: rank reads alpha as its exact binary value
  clause: 'Rank: `k = ceil((n + 1)(1 - alpha))`. Compute it exactly: a float product can be off by a tiny
    amount, and `(9 + 1) * (1 - 0.7)` rounds to `3.0000000000000004`. Two ways that pass: `Fraction(repr(alpha))`
    (reads `0.7` as `7/10`, the decimal you wrote), or subtracting a tiny tolerance such as `1e-9` before
    `ceil`. `Fraction(alpha)` on the exact binary value is not accepted.'
  killed_by: test_rank_is_read_from_the_decimal_alpha_not_a_float_product
