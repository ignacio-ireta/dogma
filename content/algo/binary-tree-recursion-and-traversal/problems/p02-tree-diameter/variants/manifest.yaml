  killed_by: test_empty_tree_and_single_node_have_diameter_zero
  visible: public
- file: reject_counts_nodes_not_edges.py
  mistake: counts nodes on the path instead of edges
  clause: 'Returns: a Python `int`, the number of edges on the longest path. A tree with one node has
    diameter 0. The empty tree has diameter 0.'
  killed_by: test_empty_tree_and_single_node_have_diameter_zero
  visible: public
- file: reject_height_as_diameter.py
  mistake: returns the height of the tree instead of the longest path
  clause: 'Returns: a Python `int`, the number of edges on the longest path. A tree with one node has
    diameter 0. The empty tree has diameter 0.'
  killed_by: test_empty_tree_and_single_node_have_diameter_zero
  visible: public
- file: reject_returns_zero_for_invalid_input.py
  mistake: returns zero for invalid input instead of raising TypeError
  clause: Raises `TypeError` when `root` is neither `None` nor an object with `val`, `left` and `right`.
  killed_by: test_wrong_root_type_raises_type_error
  visible: hidden
- file: reject_detaches_right_child.py
  mistake: detaches the right child while measuring heights
  clause: Must not mutate the tree.
  killed_by: test_tree_is_unchanged_after_the_call
