problem_version: 3
accept:
- file: accept_blind.py
  origin: blind
- file: accept_node_as_list.py
  origin: freedom
  freedom: stores each node as a plain four-item list instead of a class with attributes
reject:
- file: reject_get_drops_falsy_values.py
  mistake: get returns None for stored falsy values such as 0 or empty string
  clause: '`get(key) -> value | None`: if `key` is stored, mark it as the most recently used entry and
    return its value. If it is not stored, return `None` and change nothing.'
  killed_by: test_stored_falsy_values_are_returned_as_stored_not_as_misses
  visible: hidden
- file: reject_capacity_bool.py
  mistake: accepts bool as a capacity because bool is an int subclass
  clause: '`LRUCache(capacity)`: `capacity` must be a Python `int` of at least 1. Raises `ValueError`
    for anything else, including `bool`, `float` and `None`.'
  killed_by: test_invalid_capacity_raises_value_error
  visible: hidden
- file: reject_get_no_refresh.py
  mistake: a get hit does not refresh recency
  clause: '`get(key) -> value | None`: if `key` is stored, mark it as the most recently used entry and
    return its value. If it is not stored, return `None` and change nothing.'
  killed_by: test_get_protects_an_entry_so_the_untouched_one_is_evicted
  visible: public
- file: reject_put_existing_no_refresh.py
  mistake: a put of an existing key does not refresh recency
  clause: '`put(key, value) -> None`: `value` must not be `None`, because `None` is the miss result of
    `get`. Raises `ValueError` for `None`. If `key` is stored, overwrite its value and mark it as most
    recently used, with no eviction. If `key` is new and the cache is full, evict the least recently used
    entry first, then store the new entry as the most recently used.'
  killed_by: test_random_sequences_match_the_ordered_dict_model
  visible: hidden
- file: reject_len_full_off_by_one.py
  mistake: len is one less than the stored count when the cache is full
  clause: '`len(cache)`: the number of stored entries. It is never greater than `capacity`.'
  killed_by: test_put_of_existing_key_overwrites_the_value_without_growing_the_cache
  visible: public
- file: reject_get_linear_scan.py
  mistake: get scans every stored entry instead of a hash lookup
  clause: '`get` and `put` must run in O(1) expected time, with no scan over the stored entries.'
  killed_by: test_large_sequence_finishes_within_the_time_limit
  visible: hidden
- file: reject_map_keeps_evicted.py
  mistake: an evicted key stays in the map so its old value can come back
  clause: 'A removed entry is gone: a later `get` of its key returns `None`, and a later `put` of that
    key stores a new entry.'
  killed_by: test_get_protects_an_entry_so_the_untouched_one_is_evicted
  visible: public
- file: reject_value_list_refused.py
  mistake: put refuses list values although any object except None is a valid value
  clause: Keys are any hashable Python values. Values are any Python object except `None`.
  killed_by: test_list_value_is_stored_and_returned_unchanged
  visible: hidden
uncovered: []
sweeps:
- reject
- mutants
