  clause: Raises `ValueError` when `nodes` has a repeated name, when an edge names a node that is not
    in `nodes`, or when the dependencies contain a cycle. A self-loop `(a, a)` is a cycle.
  killed_by: test_small_graphs_with_cycles_raise_value_error_naming_a_cycle
  visible: hidden
- file: reject_cycle_wrong_direction.py
  mistake: the named cycle lists its steps in the wrong direction
  clause: 'For a cycle, the message is exactly `graph has a cycle: ` (with the trailing space), followed
    by the names of one cycle joined by ` -> `. The first and last names are equal, and every step is
    an edge of the graph. For example: `graph has a cycle: b -> c -> a -> b`. A self-loop `(a, a)` gives
    `graph has a cycle: a -> a`.'
  killed_by: test_small_graphs_with_cycles_raise_value_error_naming_a_cycle
  visible: hidden
- file: reject_two_char_string_edge.py
  mistake: a two character string is accepted as an edge
  clause: Raises `TypeError` when `nodes` is not a list, or when a name or an edge is not a string pair.
