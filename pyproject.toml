[project]
name = "dogma"
version = "0.1.0"
description = "Local-first practice platform for ML / DS / DL / RL / LLM engineering interviews."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # platform
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "typer>=0.15",
    "rich>=13.9",
    "psutil>=6.1",
    # learner runtime (py-numpy, py-data, sql-duckdb) — imported by content, not by the app
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "duckdb>=1.1",
    # grading harness runs content tests with pytest + hypothesis
    "pytest>=8.3",
    "hypothesis>=6.115",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
dogma = "dogma.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
    "types-psutil>=6.1",
]
torch = [
    "torch==2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dogma", "src/dogma_harness"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["tools/docmd", "sources", "corpus"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "N", "S", "T20", "PL"]
ignore = [
    "SIM108",  # ternary not always clearer
    "PLR2004", # magic values are normal in math code
    "PLR0913", # math functions legitimately take many parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607"]
"content/**" = ["S101", "T20", "N802", "N803", "N806", "PLR2004", "E741"]
"scripts/**" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["dogma", "dogma_harness"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["scipy.*", "sklearn.*", "statsmodels.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not slow and not llm and not e2e'"
markers = [
    "integration: multiple components together (runner + harness, DB, corpus)",
    "content: the content gate over content/",
    "e2e: CLI / API / browser end-to-end flows",
    "llm: live calls to the local model (never in the default run)",
    "slow: anything over ~5 s",
]

[tool.coverage.run]
source = ["dogma", "dogma_harness"]
branch = true

[tool.importlinter]
root_packages = ["dogma", "dogma_harness"]

[[tool.importlinter.contracts]]
name = "Harness never imports the app"
type = "forbidden"
source_modules = ["dogma_harness"]
forbidden_modules = ["dogma"]

[[tool.importlinter.contracts]]
name = "Core depends on nothing else in dogma"
type = "forbidden"
source_modules = ["dogma.core"]
forbidden_modules = ["dogma.content", "dogma.runner", "dogma.grading", "dogma.cli"]

[[tool.importlinter.contracts]]
name = "API never imports the CLI (ROADMAP I-23)"
type = "forbidden"
source_modules = ["dogma.api"]
forbidden_modules = ["dogma.cli"]

[[tool.importlinter.contracts]]
name = "Domain packages never import the CLI or the API (ROADMAP I-23)"
type = "forbidden"
source_modules = [
    "dogma.content",
    "dogma.learning",
    "dogma.runner",
    "dogma.grading",
    "dogma.tutor",
    "dogma.corpus",
    "dogma.db",
]
forbidden_modules = ["dogma.cli", "dogma.api"]
