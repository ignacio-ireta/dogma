# Import manifest: the executable form of docs/IMPORT_PLAN.md (run once by scripts/import_sources.py).
#
# snapshots: rules are evaluated in order; a later matching rule overrides an earlier one.
#   action: import   -> copy to sources/<id>/<relative path>, committed after scrubbing
#   action: exclude  -> not copied
#   rename           -> optional {regex: replacement} applied to destination file names
# corpus:   copied as-is into corpus/raw/<id>/ (gitignored, third-party). An entry may name
#           exact files with `include:` instead of `glob:`; a missing listed file stops the run.
# vendor:   copied into tools/<id>/ (committed, license kept), with VENDORED.md provenance
# `root:` is a key resolved through private/import_roots.yaml (gitignored), so no origin paths are
# committed. Origins are read only at import time; afterwards the repo never reads them again.
version: 2

snapshots:
  - id: library
    root: library
    rules:
      - {glob: "AI-ML/**/*.md", action: import}
      - {glob: "Mathematics/**/*.md", action: import}
      - {glob: "LINEAGE.md", action: import}
      - {glob: "_MOC.md", action: import}
      - {glob: "scripts/arxiv-fetch.py", action: import}
    rename:            # regex on the destination file name
      "^(.* Interview Bridge) - .*\\.md$": "\\1.md"

  - id: interview-prep
    root: interview-prep
    rules:
      - {glob: "frameworks/*.md", action: import}
      - {glob: "lessons/ref-failure-modes.md", action: import}
