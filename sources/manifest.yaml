      - {glob: "mock-interviews/SCORING_RUBRIC.md", action: import}
      - {glob: "mock-interviews/INTERVIEWER_README.md", action: import}
      - {glob: "mock-interviews/mock_assessment_v2*", action: import}
      - {glob: "mock-interviews/pack-*/**/*", action: import}
      - {glob: "reference/ml_flashcards.md", action: import}
      - {glob: "reference/ml_concepts_flashcards.md", action: import}
      - {glob: "reference/ml_ds_interview_refresher.md", action: import}
      - {glob: "reference/sklearn_cheatsheet.md", action: import}
      - {glob: "reference/syntax_cheatsheet.md", action: import}
      - {glob: "reference/business_vocabulary.md", action: import}
      - {glob: "data/*.csv", action: import}
      - {glob: "generate_mock_data.py", action: import}
      - {glob: "DAILY_HABITS.md", action: import}
      - {glob: "archive/xgboost_guide.md", action: import}
      - {glob: "archive/mlflow_guide.md", action: import}
      - {glob: "archive/aws_sagemaker_ai_guide.md", action: import}
      - {glob: "**/*.zip", action: exclude}
      - {glob: "**/.DS_Store", action: exclude}
      - {glob: "**/.ipynb_checkpoints/**", action: exclude}
      - {glob: "**/__pycache__/**", action: exclude}

  - id: mvs
    root: mvs
    rules:
      - {glob: "tools/build_*.py", action: import}
      - {glob: "tools/nbbuild.py", action: import}
      - {glob: "*.ipynb", action: import}
      - {glob: "mvslib/*.py", action: import}
      - {glob: "data/*.csv", action: import}
      - {glob: "DATA_SOURCES.md", action: import}
      - {glob: "README.md", action: import}
      - {glob: "METHOD_COMPARISON.md", action: import}

  - id: exam-lessons
    root: exam-lessons
    rules:
      - {glob: "multivariate_statistics/daily-lessons/*.md", action: import}
      - {glob: "study-notes/*.md", action: import}
      - {glob: "dp100/daily-lessons/*rag*.md", action: import}
      - {glob: "dp100/daily-lessons/*prompt-flow*.md", action: import}
      - {glob: "dp100/daily-lessons/*finetuning*.md", action: import}

  - id: legacy-viz
    root: legacy-viz
    rules:
      - {glob: "ml-metrics.html", action: import}
      - {glob: "ml-concepts.html", action: import}
      - {glob: "model-selection.html", action: import}
      - {glob: "probability-stats.html", action: import}
      - {glob: "sql-concepts.html", action: import}
      - {glob: "data-wrangling.html", action: import}

