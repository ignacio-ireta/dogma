# Core path: every tier-A topic, in study order. The planner introduces topics in this order,
# subject to `requires:` in each topic.yaml. Budget: 3 x 45-min sessions/day, ~6 days/week,
# default day = Learn + Learn + Consolidate (small topics are paired in one Learn session).
# Content authoring follows this order too, staying >= 1 week ahead of the learner.
id: core
title: "Core path: tier A, balanced DS + AI engineering"
